<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>904 견적 요청</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Poppins:wght@600;800&display=swap">
<style>
:root{
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --bg:#E9ECF2; --surface:#FFFFFF; --surface2:#F3F5F9; --line:#E2E6EE;
  --fg:#1B1F27; --muted:#7F889A; --accent:#2F66F5; --accent-fg:#FFFFFF;
  --sun:#E5484D; --sat:#2F66F5; --scrim:rgba(14,16,24,.45);
  --purple:#A47BDD; --black:#2A2B31; --green:#22B37C; --blue:#3D9FE6;
  --red:#E5484D; --coral:#F27466; --brown:#9C7B6B; --yellow:#E2AE2E; --on-yellow:#2B2200; --orange:#F5900F;
  --w-demo:#6B7280; --w-plumb:#2F5FD0; --w-wp:#0E8AA6; --w-tpre:#E89A4E; --w-tdone:#D3701A; --w-tmeji:#A8470B; --w-grout:#AE3AC6; --w-sani:#2E9E5B; --w-set:#DD3D5B; --w-dome:#6F54D6; --w-sil:#7E8B16; --w-clean:#1FA6A0; --w-etc:#8D96A5;
  --gi:#E8861C; --jun:#13A0A6; --kyung:#5B6CF0; --jo:#7C8798;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0B0E; --surface:#16181D; --surface2:#1F2128; --line:#2C2F38;
    --fg:#ECEEF3; --muted:#8E95A6; --accent:#6E94FF; --accent-fg:#0D0E12;
    --sun:#FF7A7E; --sat:#7CA2FF; --scrim:rgba(0,0,0,.6);
    --purple:#9472CC; --black:#4A4C57; --green:#23A673; --blue:#3A93D4;
    --red:#D24E4A; --coral:#DE6A5E; --brown:#8A6E60; --yellow:#CFA02D; --orange:#E0830E;
    --gi:#F2A04A; --jun:#33B8BC; --kyung:#8391FF; --jo:#98A3B6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0B0E; --surface:#16181D; --surface2:#1F2128; --line:#2C2F38;
  --fg:#ECEEF3; --muted:#8E95A6; --accent:#6E94FF; --accent-fg:#0D0E12;
  --sun:#FF7A7E; --sat:#7CA2FF; --scrim:rgba(0,0,0,.6);
  --purple:#9472CC; --black:#4A4C57; --green:#23A673; --blue:#3A93D4;
  --red:#D24E4A; --coral:#DE6A5E; --brown:#8A6E60; --yellow:#CFA02D; --orange:#E0830E;
  --gi:#F2A04A; --jun:#33B8BC; --kyung:#8391FF; --jo:#98A3B6;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

#app{position:relative;height:100%;max-width:1000px;margin:0 auto;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}


.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px 6px}
.mn{display:flex;align-items:center;gap:2px;min-width:0}
.ib{width:36px;height:36px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--surface2)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.title{font:800 22px/1.2 var(--font);letter-spacing:-.02em;padding:4px 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.acts{display:flex;align-items:center;gap:4px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:32px;padding:0 12px;font:500 13px var(--font)}
.pill:hover{background:var(--surface2)}
#searchBar{padding-block:0 8px}
#q{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--fg);padding:0 12px;font:400 14px var(--font)}
.banner{font:400 12px/1.5 var(--font);color:var(--muted);background:var(--surface2);border-radius:8px;padding:6px 10px;margin-bottom:6px}


#calView{flex:1;min-height:0;display:flex;flex-direction:column;margin-inline:-6px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);padding-block:4px 6px;font:500 12px var(--font);color:var(--muted);text-align:center}
.wk span:first-child{color:var(--sun)} .wk span:last-child{color:var(--sat)}
.cal{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-rows:repeat(6,minmax(min-content,1fr));border-bottom:1px solid var(--line);overscroll-behavior:contain}
.week{position:relative;border-top:1px solid var(--line);padding-top:44px;min-height:84px}
.cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{display:flex;flex-direction:column;align-items:center;padding-top:5px;cursor:pointer;min-width:0;border:0;background:transparent}
.day:hover{background:var(--surface2)}
.day.sel{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.n{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font:500 14px var(--font);font-variant-numeric:tabular-nums}
.lu{font:400 10px/12px var(--font);color:var(--sun);margin-top:1px;height:12px;max-width:100%;padding-inline:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.sun .n,.day.hol .n{color:var(--sun)} .day.sat:not(.hol) .n{color:var(--sat)}
.day.oth .n,.day.oth .lu{opacity:.38}
.day.today .n{background:var(--accent);color:var(--accent-fg);font-weight:700}
.bars{position:relative;pointer-events:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:20px;row-gap:3px;padding:0 1px 6px}
.bar{pointer-events:auto;--c:var(--purple);display:block;width:100%;min-width:0;height:20px;border:0;margin:0;padding:0 4px;
  font:500 11.5px/20px var(--font);color:#fff;background:var(--c);border-radius:4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.bar.timed{background:color-mix(in srgb,var(--c) 17%,var(--surface));color:var(--fg);text-align:left;box-shadow:inset 3px 0 var(--c);padding-left:7px}
.bar.c-yellow:not(.timed){color:var(--on-yellow)}
.bars.ours{min-height:23px;padding-bottom:3px}
.bars.oth{border-top:1px dashed color-mix(in srgb,var(--muted) 55%,transparent);padding-top:4px;min-height:23px}
.legend{display:flex;justify-content:flex-end;gap:12px;padding:0 8px 4px;font:500 11px var(--font);color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:8px;border-radius:2px;background:var(--black)}
.legend i.o{background:transparent;border-top:1px dashed var(--muted);height:0;width:16px}
.sep{font:700 11px var(--font);color:var(--muted);letter-spacing:.04em;display:flex;align-items:center;gap:8px;margin-top:2px}
.sep::after{content:"";flex:1;border-top:1px dashed var(--line)}
.bar.pend{background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--fg);outline:1.5px dashed var(--c);outline-offset:-1.5px}
.ptag{display:inline-block;font:700 10.5px/1 var(--font);color:var(--sun);border:1px solid var(--sun);border-radius:4px;padding:2px 4px;vertical-align:2px}
.pendchip{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:1px solid color-mix(in srgb,var(--sun) 40%,var(--line));background:color-mix(in srgb,var(--sun) 8%,var(--surface));color:var(--fg);border-radius:10px;padding:8px 12px;margin-bottom:6px;font:500 13px var(--font);text-align:left}
.pendchip b{color:var(--sun)}
.srcbox{display:grid;gap:8px;padding:12px;border:1px dashed var(--sun);border-radius:12px;background:color-mix(in srgb,var(--sun) 6%,var(--surface))}
.srcbox p{margin:0;font:400 13px/1.55 var(--font);color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere}
.srcbox b{font:700 13px var(--font);color:var(--sun)}
.phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.ph{position:relative;aspect-ratio:1;max-width:100%;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--surface2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.pday{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);margin-bottom:8px}
.pday>b{font:700 14px var(--font);color:var(--fg)}
.psec{display:grid;gap:6px}
.pst{font:600 12px var(--font);color:var(--fg)}
.pst small{color:var(--muted);font-weight:400}
.phc{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font:600 10.5px/1.2 var(--font);padding:10px 5px 4px;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phx{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font:700 14px/24px var(--font);padding:0}
.phadd{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted);font:500 12px var(--font);cursor:pointer;background:var(--surface)}
.phadd input{position:absolute;width:1px;height:1px;opacity:0}
#lb{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.cintro{font:400 13px/1.6 var(--font);color:var(--muted);margin:0}
.lrow{display:flex;flex-wrap:wrap;gap:8px}
.lchip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:500 14px var(--font)}
.lchip i,.lpick i,.gdot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.lchip select{border:0;background:transparent;color:var(--muted);font:500 12px var(--font);padding:0 2px}
.otag{height:24px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);color:var(--muted);font:600 11px var(--font);padding:0 8px}
.otag.on{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.lchip .x{width:26px;height:26px;border:0;border-radius:50%;background:transparent;color:var(--muted);font:700 14px var(--font)}
.lchip .x:hover{background:var(--surface2)}
.cform{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}
.cform input,.cform select{min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:500 15px var(--font);padding:9px 10px}
.ucard{display:grid;gap:8px;padding:10px 12px;border:1px dashed color-mix(in srgb,var(--sun) 45%,var(--line));border-radius:12px;background:color-mix(in srgb,var(--sun) 5%,var(--surface))}
.ucard .un{display:flex;justify-content:space-between;gap:8px;font:500 15px var(--font);min-width:0}
.ucard .un span{overflow-wrap:anywhere;min-width:0}
.ucard .un small{font:400 12px var(--font);color:var(--muted);white-space:nowrap}
.lpick{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);font:500 14px var(--font)}
.lpick:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:8px 2px 8px 12px;border-bottom:1px solid var(--line);box-shadow:inset 3px 0 var(--c)}
.crow .cn{font:500 15px var(--font);overflow-wrap:anywhere;min-width:0}
.crow .cn small{display:block;font:400 12px var(--font);color:var(--muted)}
.crow select{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:500 13px var(--font);padding:6px}
.crow .x{width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:var(--muted);font:700 15px var(--font)}
.crow .x:hover{background:var(--surface2);color:var(--sun)}
.chint{font:500 12px var(--font);color:var(--fg);display:flex;align-items:center;gap:6px}
.qcard{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.qcard textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:400 14px/1.5 var(--font);padding:10px;resize:vertical}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 2px 10px 12px;box-shadow:inset 3px 0 var(--c,var(--line))}
.qrow:hover{background:var(--surface2)}
.qrow .qt{font:500 15px var(--font);overflow-wrap:anywhere;min-width:0}
.qrow .qm{font:400 12px var(--font);color:var(--muted);grid-column:1/-1;font-variant-numeric:tabular-nums}
.qrow .qs{font:700 15px var(--font);font-variant-numeric:tabular-nums;text-align:right}
.stag{display:inline-block;font:600 10.5px/1 var(--font);border-radius:4px;padding:3px 5px;margin-right:4px;vertical-align:1px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.stag.sent{color:var(--accent);border-color:var(--accent)} .stag.ok{color:var(--green);border-color:var(--green)}
.ptab{width:100%;border-collapse:collapse;font:400 13px var(--font);font-variant-numeric:tabular-nums}
.ptab th{font:600 11px var(--font);color:var(--muted);text-align:left;padding:4px}
.ptab td{padding:3px 4px;border-top:1px solid var(--line);vertical-align:middle}
.ptab input,.ptab select{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:500 13px var(--font);padding:6px}
.ptab input.num{text-align:right}
.ptab .x{width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:var(--muted);font:700 14px var(--font)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.qtot{display:grid;gap:4px;font:500 14px var(--font);font-variant-numeric:tabular-nums}
.qtot div{display:flex;justify-content:space-between}
.qtot .big{font:800 18px var(--font)}
details.pricebox summary{cursor:pointer;font:700 14px var(--font);padding:4px 0}
.more{pointer-events:auto;border:0;background:transparent;font:500 11px/20px var(--font);color:var(--muted);text-align:center;padding:0}
.c-purple{--c:var(--purple)} .c-black{--c:var(--black)} .c-green{--c:var(--green)} .c-blue{--c:var(--blue)}
.c-red{--c:var(--red)} .c-coral{--c:var(--coral)} .c-orange{--c:var(--orange)} .c-brown{--c:var(--brown)} .c-yellow{--c:var(--yellow)}


.scroll{flex:1;min-height:0;overflow-y:auto;padding-block:4px 96px}
.ag-day{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
.ag-date{text-align:center;line-height:1.1}
.ag-date b{display:block;font:700 22px var(--font);font-variant-numeric:tabular-nums}
.ag-date span{font:400 11px var(--font);color:var(--muted)}
.ag-date.today b{color:var(--accent)}
.ag-date.sun b{color:var(--sun)} .ag-date.sat b{color:var(--sat)}
.ag-items{display:flex;flex-direction:column;gap:6px;min-width:0}
.item{display:flex;align-items:stretch;gap:10px;width:100%;text-align:left;border:0;background:var(--surface2);border-radius:10px;padding:9px 12px 9px 10px;min-width:0}
.item .stripe{width:4px;border-radius:2px;background:var(--c);flex:none}
.item .tx{min-width:0;flex:1}
.item .t{font:500 14px/1.35 var(--font);overflow-wrap:anywhere}
.item .s{font:400 12px/1.4 var(--font);color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums}
.item .m{font:400 12px/1.4 var(--font);color:var(--muted);margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:48px 16px;text-align:center;color:var(--muted);font:400 14px/1.7 var(--font)}
.empty b{display:block;color:var(--fg);font-weight:700;margin-bottom:4px}
.wkrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.wkp{display:inline-flex;align-items:center;gap:4px;font:500 11px var(--font);padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--k) 16%,var(--surface))}
.wkp i{width:7px;height:7px;border-radius:50%;background:var(--k)}
.crewline{font:400 12px/1.5 var(--font);color:var(--fg);margin-top:4px;overflow-wrap:anywhere}
.crewline .off{color:var(--sun);font-weight:500}


.wk-demo{--k:var(--w-demo)} .wk-plumb{--k:var(--w-plumb)} .wk-wp{--k:var(--w-wp)} .wk-tpre{--k:var(--w-tpre)} .wk-tdone{--k:var(--w-tdone)} .wk-tmeji{--k:var(--w-tmeji)} .wk-grout{--k:var(--w-grout)} .wk-sani{--k:var(--w-sani)}
.wk-set{--k:var(--w-set)} .wk-dome{--k:var(--w-dome)} .wk-sil{--k:var(--w-sil)} .wk-clean{--k:var(--w-clean)} .wk-etc{--k:var(--w-etc)}
.g-gi{--gc:var(--gi)} .g-jun{--gc:var(--jun)} .g-kyung{--gc:var(--kyung)} .g-jo{--gc:var(--jo)}


.stack{display:flex;flex-direction:column;gap:18px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum div{background:var(--surface2);border-radius:12px;padding:12px 14px;min-width:0}
.sum small{display:block;font:400 12px var(--font);color:var(--muted)}
.sum b{display:block;font:700 18px var(--font);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
h3{margin:0 0 8px;font:700 14px var(--font);display:flex;align-items:center;gap:6px}
h3 small{font-weight:400;color:var(--muted)}
.gd{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gc);flex:none}
.wg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.wg-grid label{display:grid;gap:4px;font:500 12px var(--font);color:var(--muted)}
.wg-grid .lab{display:flex;align-items:center;gap:6px}
.wg-grid .lab input{flex:1;min-width:0;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--fg);font:500 13px var(--font);padding:2px 0}
.wgi{display:flex;align-items:center;gap:6px}
.wgi input{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--fg);font:500 15px var(--font);padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums}
.wgi em{font:400 13px var(--font);color:var(--muted);font-style:normal;flex:none}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n m" "s m";column-gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 2px 10px 12px;box-shadow:inset 3px 0 var(--gc,var(--line))}
.wrow:hover{background:var(--surface2)}
.wn{grid-area:n;font:500 15px var(--font);overflow-wrap:anywhere}
.ws{grid-area:s;font:400 12px var(--font);color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.wm{grid-area:m;align-self:center;font:500 13px var(--font);font-variant-numeric:tabular-nums;text-align:right}
.wempty{font:400 13px var(--font);color:var(--muted);padding:8px 2px}
.nowcard{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.qadd{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.qadd:not(:has(#qTeam)){grid-template-columns:minmax(0,1fr) auto auto}
@media (max-width:420px){.qadd{grid-template-columns:1fr 1fr}.qadd input{grid-column:1/-1}}
.qadd input,.qadd select,.fld input,.fld select,.fld textarea{min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:500 15px var(--font);padding:9px 10px}

  if (d.matby){ readForm(); D.mat = {...matOf(D), by: d.matby}; renderDlg(); return; }
});
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.id === "fZone"){ ev.preventDefault(); document.querySelector("[data-zoneadd]")?.click(); } });
document.addEventListener("input", ev => { if (ev.target.closest("#dlg") && D){ readForm(); const m = missing(); $("#vMiss").textContent = m.length ? `아직 비어 있어요: ${m.join(", ")}` : "다 적었어요. 아래 버튼을 눌러 보내 주세요"; } });

/* 임시 저장 (이 기기만) */
const DKEY = "904req.v2";
function saveDraft(){ try { const {_open, _sqDone, ...rest} = D; localStorage.setItem(DKEY, JSON.stringify({...rest, _open: [..._open || []], _sqDone: [...(_sqDone || [])]})); } catch(_){} }
function blankD(){ const k = todayK(); return {start: k, end: k, off: [], rooms: [], zoneSpec: {}, proc: {}, plan: {}, _open: new Set(), company: "", person: "", phone: "", addr: "", pw: "", nopw: false, mat: {by: "client", note: ""}, memo: ""}; }
function loadD(){ try { const x = JSON.parse(localStorage.getItem(DKEY) || "null"); if (x && x.rooms){ x._open = new Set(x._open || []); x._sqDone = new Set(x._sqDone || []); x.off = x.off || []; x.plan = x.plan || {}; return x; } } catch(_){} return blankD(); }

/* 보내기 */
const plain = h => { const e = document.createElement("div"); e.innerHTML = h; return e.textContent.replace(/\s+/g, " ").trim(); };
function buildText(){
  const L = ["[904 타일 견적 요청]"], e = evEnd(D);
  L.push(`업체: ${[D.company, D.person, D.phone].filter(Boolean).join(" · ")}`);
  L.push(`현장: ${D.addr || ""}`); L.push(`비번: ${D.nopw ? "없음" : D.pw || "-"}`);
  L.push(`기간: ${md(D.start)}(${WD[wdOf(D.start)]})${e !== D.start ? ` ~ ${md(e)}(${WD[wdOf(e)]}) · ${diff(D.start, e) + 1}일` : " 하루"}${D._dateSet ? "" : " (아직 안 정함)"}`);
  L.push(""); L.push("시공 구역"); for (const r of D.rooms || []){ const t = lblText(zsText(r)); L.push(`■ ${r}${t ? ": " + t : ""}`); }
  const ks = sqSel(); if (ks.length){ L.push(""); L.push("공정"); ks.forEach((k, i) => { L.push(`${i + 1}. ${KIND_LABEL[k]}: ${plain(sqSummary(k))}`); const n = D.proc[k].note; if (n && k !== "etc") L.push(`   메모: ${n}`); }); }
  const mt = matOf(D); L.push(""); L.push(`자재: ${mt.by === "ours" ? "904가 준비" + (mt.note ? ` (${mt.note})` : "") : "업체가 준비"}`);
  if (D.memo) L.push(`특이사항: ${D.memo}`);
  return L.join("\n");
}
function payload(){ const proc = {}; for (const k of sqSel()){ const p = D.proc[k]; proc[k] = {by: p.by, opt: {...(p.opt || {})}, rooms: p.rooms || [], note: p.note || "", coats: p.coats, meji: p.meji}; if (proc[k].opt.폐기물) proc[k].opt.폐기물 = WASTE[proc[k].opt.폐기물] || proc[k].opt.폐기물; }
  return {v: 2, company: D.company, person: D.person, phone: D.phone, addr: D.addr, pw: D.pw, nopw: !!D.nopw, mat: matOf(D), memo: D.memo || "",
    start: D._dateSet ? D.start : "", end: D._dateSet ? evEnd(D) : "", rooms: D.rooms || [], zoneSpec: Object.fromEntries((D.rooms || []).map(r => [r, zsClean(r, (D.zoneSpec || {})[r])])), proc}; }
let sending = false;
async function send(){
  readForm(); const m = missing(); if (m.length){ toast(`${m.join(", ")}을(를) 먼저 적어 주세요`); return; }
  if (sending) return; sending = true; const b = $("#vSend"); b.disabled = true; b.textContent = "보내는 중…";
  try {
    const r = await fetch(SEND_TO, {method: "POST", headers: {"Content-Type": "application/json", "Accept": "application/json"},
      body: JSON.stringify({_subject: `[견적 요청] ${D.company} · ${D.addr}`, _template: "box", _captcha: "false", 업체: D.company, 연락처: D.phone, 요청서: buildText(), data: JSON.stringify(payload())})});
    const j = await r.json().catch(() => ({})); if (!r.ok || j.success === false || j.success === "false") throw new Error(j.message || r.status);
    try { localStorage.removeItem(DKEY); } catch(_){}
    $("#dlg").hidden = true; $("#done").hidden = false; window.scrollTo({top: 0});
  } catch(_){ toast("보내지 못했어요. 잠시 뒤 다시 눌러 주세요"); }
  sending = false; b.disabled = false; b.textContent = "견적 요청 보내기";
}
$("#vSend").addEventListener("click", send);
$("#again").addEventListener("click", () => { D = blankD(); $("#done").hidden = true; $("#dlg").hidden = false; renderDlg(); });
// 섹션을 다 채우고 '다 적었어요'를 누르면 접힘
document.addEventListener("click", ev => { const t = ev.target.closest("[data-vdone]"); if (!t) return; readForm(); const n = t.dataset.vdone; D["_" + n + "Done"] = true; D._open.delete(n); renderDlg(); });

D = loadD(); renderDlg();
</script>
</body></html>
